<a href="./">← Formwheel Hub</a><h1>💡 개선점 제출</h1><p>Formwheel에 추가하면 좋을 기능이나 불편했던 점을 알려주세요!</p>
<section class="panel"><form id="feedback-form"><label for="project">프로젝트</label><select id="project" required><option value="Hub">Hub</option><option value="Cook/Clicker/Wheel/Quiz/Casino/Marble/Music Battle feedback (plz)">Cook/Clicker/Wheel/Quiz/Casino/Marble/Music Battle feedback (plz)</option><option value="Tools">Tools</option><option value="Games">Games</option><option value="Questions">Questions</option><option value="Decoration">Decoration</option><option value="Ideas">Ideas</option><option value="Others">Others</option></select>
<label for="subject">제목</label><input id="subject" maxlength="80" required placeholder="어떤 점을 개선하면 좋을까요?">
<label for="body">개선점 내용</label><textarea id="body" minlength="5" maxlength="2000" required placeholder="개선 아이디어나 재현 방법을 자세히 알려주세요. 개인정보는 넣지 마세요."></textarea>
<button id="submit" type="submit">개선점 제출하기</button><p id="status" role="status" aria-live="polite"></p></form></section>
<p class="minor">제출 내용은 운영자 확인용으로 저장됩니다. 개인정보·비밀번호는 입력하지 마세요.</p>
<p><button type="button" id="open-admin" style="background:transparent;color:#667084;padding:5px;font-size:12px">개선점 확인</button></p>
<section id="admin" class="panel" hidden><h2>개선점 확인</h2><form id="code-form"><label for="code">확인 코드</label><input id="code" type="password" autocomplete="off" required><button type="submit" style="margin-top:12px">확인</button></form><p id="admin-status" role="status" aria-live="polite"></p><div id="items" hidden><button type="button" id="lock" style="background:#65708a">목록 닫기</button><div id="list"></div></div></section>
